name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AEA835: ${{ secrets.AEA835 }}
          BC0A5E: ${{ secrets.BC0A5E }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('AEA835', '')
          k2 = os.environ.get('BC0A5E', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- d02d07e42a38b0b14a61301d01dd -->', k1) if k1 else txt
          out = out.replace('<!-- 6f3a9310c8dc09865a8b4158d75c2919 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
